 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <div>
                <h1>My Library</h1>
                <p>Your personal online book collection</p>
            </div>
        </div>
    </header>

    <main>

        <section class="stats">
            <div class="stat-box">
                <h2 id="totalBooks">0</h2>
                <p>Total Books</p>
            </div>

            <div class="stat-box">
                <h2 id="availableBooks">0</h2>
                <p>Available</p>
            </div>

            <div class="stat-box">
                <h2 id="borrowedBooks">0</h2>
                <p>Borrowed</p>
            </div>
        </section>

        <section class="controls">

            <div class="search">
                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search by title or author..."
                >
            </div>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Fiction">Fiction</option>
                <option value="Science">Science</option>
                <option value="Technology">Technology</option>
                <option value="History">History</option>
                <option value="Self Help">Self Help</option>
            </select>

            <button id="showAddBook">+ Add Book</button>

        </section>

        <section class="add-book" id="addBookSection">

            <h2>Add a New Book</h2>

            <div class="form">
                <input type="text" id="bookName" placeholder="Book title">
                <input type="text" id="authorName" placeholder="Author name">

                <select id="bookCategory">
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                    <option value="Technology">Technology</option>
                    <option value="History">History</option>
                    <option value="Self Help">Self Help</option>
                </select>

                <input
                    type="text"
                    id="bookImage"
                    placeholder="Book image URL"
                >

                <button id="addBookButton">Add Book</button>
            </div>

        </section>

        <section class="books-section">

            <div class="section-title">
                <h2>Books Collection</h2>
                <span id="bookCount">0 books</span>
            </div>

            <div id="bookList"></div>

        </section>

    </main>

    <footer>
        <p>My Library © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
